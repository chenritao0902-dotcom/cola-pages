            content: '';

        html { scroll-behavior: smooth; }
        .logo-card { transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .logo-card:hover { transform: translateY(-4px); }
        .logo-canvas { position: relative; transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .logo-aura {
            position: absolute; inset: 0;
            background: radial-gradient(circle, rgba(10,74,63,0.12) 0%, transparent 70%);
            border-radius: 50%; transform: scale(0.5); opacity: 0;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(40px); pointer-events: none;
        }
        .logo-card:hover .logo-aura { transform: scale(1); opacity: 1; }
        .logo-card:hover .logo-canvas { color: #0A4A3F; }
        .divider-line {
            width: 0; height: 1px; background: #0A4A3F; opacity: 0.3;

        .logo-card:hover .divider-line { width: 100%; }
        .tracking-ultra-wide { letter-spacing: 0.2em; }
        .text-balance { text-wrap: balance; }
        .color-swatch { transition: transform 0.3s ease; }
        .color-swatch:hover { transform: scale(1.1); }

                        <div className="w-12 h-[1px] mx-auto opacity-30" style={{background:'#0A4A3F'}}></div>
                    </div>

                    {/* Color Toggle */}
                    <div className="flex gap-3 mb-16 items-center">
                        <span className="font-mono text-xs opacity-40 uppercase tracking-wider mr-2">Preview Color:</span>
                        {colorPalette.map((c) => (
                            <button key={c.hex}
                                onClick={() => setActiveColor(c.hex === '#F5F0E8' ? '#1A1A1A' : c.hex)}
                                className="color-swatch w-8 h-8 rounded-full border-2 border-white shadow-md"
                                style={{background: c.hex, outline: activeColor === c.hex ? '2px solid #0A4A3F' : 'none', outlineOffset: '2px'}}
                                title={`${c.name} / ${c.hex}`}
                            />
                        ))}
                    </div>

                    {/* Logo Grid */}
                    <div className="max-w-7xl w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-12 mb-32">
                        {logos.map((logo, index) => (
                            <div key={index} className="flex flex-col items-center logo-card cursor-pointer">
                                <div className="w-64 h-64 mb-10 flex items-center justify-center relative">
                                    <div className="logo-aura"></div>
                                    <div className="w-32 h-32 relative z-10 logo-canvas" style={{color: activeColor}}>
                                        <logo.Component />
                                    </div>
                                </div>
                                <div className="text-center w-full px-4">
                                    <h2 className="text-xl font-medium tracking-wider mb-2 uppercase">
                                        {logo.title}
                                    </h2>
                                    <h3 className="text-xs font-mono opacity-50 tracking-widest mb-6">
                                        {logo.subtitle}
                                    </h3>
                                    <p className="text-sm leading-relaxed opacity-70 text-left font-light text-balance">
                                        {logo.philosophy}
                                    </p>
                                </div>
                                <div className="divider-line mt-8 mx-auto"></div>
                            </div>
                        ))}
                    </div>

                    {/* Brand Info Section */}
                    <div className="max-w-4xl w-full mb-32">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                            <div>
                                <h3 className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide mb-4">Brand</h3>
                                <p className="text-2xl font-light mb-2">Goalmi 考个米理工作室</p>
                                <p className="text-sm opacity-60">米兰理工设计/建筑/工程本科入学考试辅导</p>
                                <p className="text-sm opacity-60 mt-1">100% 上线率 · 米理学姐 Tina 亲自带飞</p>
                            </div>
                            <div>
                                <h3 className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide mb-4">Design System</h3>
                                <div className="space-y-2">
                                    {colorPalette.map((c) => (
                                        <div key={c.hex} className="flex items-center gap-3">
                                            <div className="w-5 h-5 rounded" style={{background: c.hex}}></div>
                                            <span className="text-sm font-mono">{c.name}</span>
                                            <span className="text-xs opacity-40 font-mono">{c.hex}</span>
                                            <span className="text-xs opacity-40 ml-auto">{c.usage}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="mt-16 max-w-2xl text-center">
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide leading-loose">
                            Generated with Logo Generator Skill<br/>
                            2026 · Goalmi Brand Identity System
                        </p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<LogoShowcase />, document.getElementById('root'));
    </script>
</body>
</html>
